<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>
<meta name="description" content="Workout tracker for progressive overload.">
<meta name="theme-color" content="#15110F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBF6F1" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;overscroll-behavior-y:none}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one phone-width app column, scrolling content over a fixed tab bar; sheets slide up from the bottom.
   Dark-first; a warm light theme follows the system, and each person can pin Light or Dark in settings (.t-light / .t-dark). */
:root{
  --bg:#15110F; --surface:#211A17; --surface2:#2B221E; --line:#352A25; --line2:#4A3B34;
  --fg:#F7F1EA; --on-fg:#15110F; --muted:#B3A79F; --faint:#93867E;
  --coral:#FF8552; --coral-text:#FF8552; --coral-soft:#3A2419; --coral-fg:#FFB08F; --ink:#15110F;
  --mint:#3DDC97; --mint-text:#3DDC97; --mint-bg:#143326; --mint-fg:#7FF0BE;
  --gold:#FFC94A; --gold-text:#FFC94A; --gold-bg:#4A3418;
  --blue:#8FB0FF; --note-bg:#1A1F2E; --note-fg:#E2E8FA; --note-meta:#A9BCEB;
  --warm:#FFC94A; --scrim:rgba(8,6,5,.72);
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FBF6F1; --surface:#FFFFFF; --surface2:#F4ECE5; --line:#EADFD6; --line2:#D8C9BD;
  --fg:#2A1F1A; --on-fg:#FFFFFF; --muted:#6B5D55; --faint:#7A6C63;
  --coral:#FF7A45; --coral-text:#B8461C; --coral-soft:#FFE7DC; --coral-fg:#A8401A;
  --mint:#2BC07F; --mint-text:#137A4C; --mint-bg:#DDF5E8; --mint-fg:#106B43;
  --gold:#FFC23D; --gold-text:#8A5E00; --gold-bg:#FFF0C7;
  --blue:#5B7FD6; --note-bg:#ECF1FF; --note-fg:#1F2A44; --note-meta:#43558A;
  --warm:#9A6400; --scrim:rgba(42,31,26,.4); color-scheme:light}}
:root[data-theme="light"],:root.t-light{
  --bg:#FBF6F1; --surface:#FFFFFF; --surface2:#F4ECE5; --line:#EADFD6; --line2:#D8C9BD;
  --fg:#2A1F1A; --on-fg:#FFFFFF; --muted:#6B5D55; --faint:#7A6C63;
  --coral:#FF7A45; --coral-text:#B8461C; --coral-soft:#FFE7DC; --coral-fg:#A8401A;
  --mint:#2BC07F; --mint-text:#137A4C; --mint-bg:#DDF5E8; --mint-fg:#106B43;
  --gold:#FFC23D; --gold-text:#8A5E00; --gold-bg:#FFF0C7;
  --blue:#5B7FD6; --note-bg:#ECF1FF; --note-fg:#1F2A44; --note-meta:#43558A;
  --warm:#9A6400; --scrim:rgba(42,31,26,.4); color-scheme:light}
:root.t-dark{
  --bg:#15110F; --surface:#211A17; --surface2:#2B221E; --line:#352A25; --line2:#4A3B34;
  --fg:#F7F1EA; --on-fg:#15110F; --muted:#B3A79F; --faint:#93867E;
  --coral:#FF8552; --coral-text:#FF8552; --coral-soft:#3A2419; --coral-fg:#FFB08F;
  --mint:#3DDC97; --mint-text:#3DDC97; --mint-bg:#143326; --mint-fg:#7FF0BE;
  --gold:#FFC94A; --gold-text:#FFC94A; --gold-bg:#4A3418;
  --blue:#8FB0FF; --note-bg:#1A1F2E; --note-fg:#E2E8FA; --note-meta:#A9BCEB;
  --warm:#FFC94A; --scrim:rgba(8,6,5,.72); color-scheme:dark}
:root.t-light{color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-display);font-size:15px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:16px 170px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2.lbl{margin:0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:20px;border:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);flex-shrink:0}
.av-sm{width:30px;height:30px;border-radius:15px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.tap{text-align:left;width:100%;display:block;color:var(--fg)}
.tap:hover{border-color:var(--line2)}
.btn{height:48px;border-radius:24px;border:0;padding:0 20px;font-weight:800;font-size:15px}
.btn-coral{background:var(--coral);color:var(--ink)}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--fg);font-weight:600}
.btn-dash{background:transparent;border:1px dashed var(--line2);color:var(--muted);font-weight:600;border-radius:14px;height:46px;width:100%}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--fg)}
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--on-fg);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:var(--ink);font-weight:800}
.chip:disabled{opacity:.4;border-style:dashed;cursor:default}
.chip-x{background:var(--coral-soft);border-color:transparent;color:var(--coral-fg)}
.title-edit{display:flex;align-items:center;gap:8px;border-radius:12px;margin-left:-8px;padding:0 8px;border:1px solid transparent}
.title-edit:focus-within{border-color:var(--coral);background:var(--surface)}
.title-edit input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-size:30px;font-weight:800;letter-spacing:-.02em;padding:4px 0;outline:none;font-family:var(--f-display)}
.title-edit svg{color:var(--faint);flex-shrink:0}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex-shrink:0}
.toast button{margin-left:12px;background:transparent;border:0;color:var(--coral-text);font-weight:800;padding:4px 2px}
.toast{display:flex;align-items:center}
.toast[hidden]{display:none}
.plate-hint{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 2px 58px;padding:5px 6px 5px 12px;background:var(--surface2);border-radius:10px;font-size:13px;color:var(--muted);animation:up .15s ease-out}
.plate-hint .chip{height:34px;flex-shrink:0}
.pl-stage{position:relative;height:150px;border-radius:16px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:3px;overflow:hidden}
.pl-collar{width:10px;height:40px;border-radius:3px;background:var(--line2);flex-shrink:0}
.pl-sleeve{flex:1;height:12px;border-radius:6px;background:var(--line2);min-width:24px}
.pl-plate{border:0;border-radius:5px;flex-shrink:0;padding:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.pl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pl-btn{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px}
.pl-dot{width:12px;height:12px;border-radius:6px}
.pl-more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);min-height:32px;display:flex;align-items:center}
.setup{display:flex;align-items:center;gap:10px;background:var(--surface2);border:0;border-radius:12px;padding:10px 12px;font-size:14px;color:var(--fg);text-align:left;width:100%}
.setup svg{color:var(--faint);flex-shrink:0}
.vpill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;background:var(--coral-soft);color:var(--coral-fg);font-size:12px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.vbtn{min-height:38px;border:1px solid var(--coral);background:var(--coral-soft);color:var(--coral-fg);border-radius:19px;padding:0 12px;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center;text-align:left}
.vbtn[aria-pressed="false"]{background:transparent;border-color:var(--line2);color:var(--fg)}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.pr{font-size:11px;font-weight:800;color:var(--ink);background:var(--gold);padding:2px 7px;border-radius:5px;letter-spacing:.03em}
.note{background:var(--note-bg);color:var(--note-fg);border-radius:12px;padding:9px 11px;font-size:14px}
.note .meta{font-size:12px;color:var(--note-meta);font-weight:600;margin-bottom:3px}
mark{background:var(--gold-bg);color:var(--gold-text);border-radius:3px;padding:0 2px}
.good{color:var(--mint-text);font-weight:600}
.banner-good{display:flex;align-items:center;gap:8px;background:var(--mint-bg);color:var(--mint-fg);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.last{background:var(--surface2);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--muted)}
.last b{color:var(--fg);font-weight:500;font-family:var(--f-num)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .num{font-size:24px;font-weight:700}
.stat div:last-child{font-size:12px;color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;height:48px;border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:0 16px;color:var(--faint);width:100%;font-size:15px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-size:16px;outline:none}
.search:focus-within{border:2px solid var(--coral)}
/* set grid */
.sets{display:flex;flex-direction:column;gap:6px}
.sgrid{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr) 58px 44px;gap:6px;align-items:center}
.shead{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);line-height:1.15;padding:0 2px}
.sin{width:100%;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);font-family:var(--f-num);font-size:17px;padding:0 8px;text-align:center}
.sin:focus{border:2px solid var(--coral);outline:none}
.done .sin{border-color:transparent;background:transparent;color:var(--muted)}
.stype{height:44px;border-radius:10px;border:0;background:transparent;font-weight:800;font-size:14px;color:var(--fg)}
.stype.t-W{color:var(--warm)} .stype.t-D{color:var(--coral-fg);font-size:12px} .stype.t-A{color:var(--blue);font-size:11px}
.check{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center}
.done .check{background:var(--mint);border-color:var(--mint);color:var(--ink)}
.done .check.w{background:var(--surface2);border-color:var(--surface2);color:var(--mint-text)}
textarea{width:100%;min-height:64px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);padding:10px;font-size:14px;resize:vertical}
/* bars */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.tabbar nav{max-width:440px;margin:0 auto;display:flex;justify-content:space-around}
.tabbar button{background:none;border:0;color:var(--faint);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;padding:4px 0}
.theme-card{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:10px;color:var(--fg);text-align:left}
.theme-card[aria-pressed="true"]{border:2px solid var(--coral)}
.theme-prev{display:block;border:1px solid;border-radius:12px;padding:10px;height:78px}
.unit-tg{height:30px;padding:0 6px;border-radius:8px;border:1px dashed var(--line2);background:transparent;color:var(--fg);font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.unit-tg.kg{border:1px solid var(--blue);color:var(--blue);background:transparent}
.tabbar button[aria-current="page"]{color:var(--coral-text);font-weight:800}
.top.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);margin-inline:-16px;padding:8px 16px;margin-top:-8px;border-bottom:1px solid transparent}
.add-ex{height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-weight:700;font-size:14px;white-space:nowrap}
.rest{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;padding:0 16px}
.rest > div{max-width:408px;margin:0 auto;height:64px;border-radius:32px;background:var(--coral);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 22px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.rest .num{font-size:24px;font-weight:700}
.rest button{height:46px;padding:0 16px;border-radius:23px;border:0;font-weight:800;font-size:15px}
/* sheet */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:440px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);align-self:center}
.sheet-top{position:relative;min-height:44px;display:flex;justify-content:center;align-items:flex-start;margin-bottom:-6px}
.sheet-top .grab{margin-top:2px}
.sheet-x{position:absolute;right:0;top:4px;background:var(--surface2)}
.sheet fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sheet legend{padding:0;margin-bottom:8px}
.sheet .opt{background:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.optbtn{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-weight:600;font-size:14px;padding:0 10px}
.optbtn[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:var(--ink);font-weight:800}
.loadopt{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:14px;width:100%}
.loadopt[aria-pressed="true"]{border:2px solid var(--coral);font-weight:800}
.loadopt span:last-child{color:var(--faint);font-size:13px;font-weight:500}
.field{height:50px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);padding:0 14px;font-size:17px;width:100%}
.field:focus{border:2px solid var(--coral);outline:none}
.switch{display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:15px}
.switch input{width:22px;height:22px;accent-color:var(--coral)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--on-fg);font-weight:700;padding:12px 18px;border-radius:24px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.celebrate{background:var(--gold-bg);border:1px solid var(--gold);border-radius:18px;padding:16px;color:var(--gold-text)}
.sample{font-size:12px;color:var(--faint);text-align:center;padding-top:6px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.app{padding-top:calc(16px + env(safe-area-inset-top,0px))}
.sync-dot{width:12px;height:12px;border-radius:6px;flex-shrink:0;background:var(--faint)}
.sync-dot.s-synced{background:var(--mint)} .sync-dot.s-syncing{background:var(--gold)} .sync-dot.s-error{background:var(--coral)} .sync-dot.s-off{background:var(--coral)}
.top.sticky{top:0;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.onboard{display:flex;flex-direction:column;gap:22px;padding-top:24px;padding-bottom:40px}
.onboard .mark{width:64px;height:64px;border-radius:18px;background:var(--coral);color:var(--ink);display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="app" id="root"></div>
<div id="restbar"></div>
<div class="tabbar" id="tabs"></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
const KEY="liftlog-v1";
const DAY=864e5;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ICON={
  x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  xs:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',

/* ---------- history ---------- */
function statsFor(who){
  const ss=sessionsOf(who);const now=new Date();const wk=weekStart(now).getTime();
  const thisWk=ss.filter(s=>s.date>=wk).length;
  const pr=prMap();const m0=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const prs=ss.filter(s=>s.date>=m0&&pr.sess[s.id]).length;
  let streak=0,w=wk;if(!ss.some(s=>s.date>=w))w-=7*DAY;
  while(ss.some(s=>s.date>=w&&s.date<w+7*DAY)){streak++;w-=7*DAY}
  return {thisWk,prs,streak};
}

function matchEx(q){q=q.trim().toLowerCase();if(!q)return [];const nq=normName(q);return S.exercises.concat(PX).filter(e=>(e.name+" "+(e.brand||"")+" "+EQ[e.equip]).toLowerCase().includes(q)||(nq.length>2&&(normName(e.name).includes(nq)||normBrand(e.brand).includes(nq))))}

function chart(pts,ss,exId){
  const ex=exById(exId);
  const W=340,H=150,pl=34,pr_=10,pt=10,pb=22;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));if(hi-lo<10){hi+=5;lo-=5}
  const pad=(hi-lo)*0.12;lo-=pad;hi+=pad;
  const x=i=>pl+(pts.length===1?(W-pl-pr_)/2:i*(W-pl-pr_)/(pts.length-1));
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const ticks=[lo+(hi-lo)*0.15,(lo+hi)/2,hi-(hi-lo)*0.15];
  const noteT=new Set(ss.filter(s=>s.entries.find(e=>e.exId===exId&&e.note)).map(s=>s.date));
  const line=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const area=`${x(0).toFixed(1)},${H-pb} ${line} ${x(pts.length-1).toFixed(1)},${H-pb}`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Estimated max over the last ${pts.length} sessions, from ${Math.round(toDisp(pts[0].v,ex))} to ${Math.round(toDisp(pts[pts.length-1].v,ex))} ${uLbl(ex)}">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr_}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${(y(t)+4).toFixed(1)}" text-anchor="end" fill="var(--faint)" font-size="10" font-family="JetBrains Mono, monospace">${Math.round(toDisp(t,ex))}</text>`).join("")}
    <polygon points="${area}" fill="var(--mint)" fill-opacity=".1"/>
    <polyline points="${line}" fill="none" stroke="var(--mint)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

/* ---------- templates ---------- */
function renderTemplates(){
  if(ui.tplId)return renderTemplate();
  let h=topbar("Templates");
  h+=`<div class="stack">`;
  if(!S.templates.some(t=>t.for===S.me))h+=`<div class="card muted small">Templates are workouts you repeat, like Upper 1 or Lower 2. Make one here, or finish any workout and choose to save it as a template.</div>`;
  for(const who of [S.me]){
    const ts=S.templates.filter(t=>t.for===who);
    h+=`<h2 class="lbl" style="margin-top:4px">${who===S.me?"Yours":"For "+esc(U(who).name)}</h2>`;
    for(const t of ts)h+=`<button class="card tap" data-a="openTpl" data-id="${t.id}"><div class="between"><span style="font-weight:800;font-size:17px">${esc(t.name)}</span><span class="small muted">${t.items.length} exercise${t.items.length===1?"":"s"}</span></div>
      <div class="small muted" style="margin-top:4px">${t.items.map(i=>esc(exById(i.exId).name)).join(" · ")}</div></button>`;
    h+=`<button class="btn-dash" data-a="newTpl" data-for="${who}">+ New template ${who===S.me?"":"for "+esc(U(who).name)}</button>`;
  }
  return h+`</div>`;
}
function renderTemplate(){
  const t=S.templates.find(x=>x.id===ui.tplId);if(!t){ui.tplId=null;return renderTemplates()}
  const sh=!!ui.short[t.id];
  let h=`<div class="between" style="margin-bottom:14px"><button class="icon-btn" data-a="closeTpl" aria-label="Back">${ICON.back}</button>
    <span class="tag" style="padding:8px 12px;border-radius:16px">${t.for===S.me?"For you":"Building for: "+esc(U(t.for).name)}</span></div>
    <label><span class="eyebrow">Template name</span><input class="field" id="tplname" data-in="tplname" value="${esc(t.name)}" style="margin-top:6px;font-weight:800;font-size:22px"></label>
    <div class="stack" style="margin-top:14px">
    <div class="seg" role="group" aria-label="Preview session length"><button aria-pressed="${!sh}" data-a="setShort" data-id="${t.id}" data-v="0">Full</button><button aria-pressed="${sh}" data-a="setShort" data-id="${t.id}" data-v="1">Short (core only)</button></div>`;
  t.items.forEach((it,i)=>{const ex=exById(it.exId);if(sh&&!it.core)return;
    h+=`<div class="card stack" style="${it.core?"":"border-style:dashed"}"><div class="between" style="align-items:flex-start"><div style="min-width:0">
      <div style="font-weight:800;font-size:16px">${esc(ex.name)}</div><div class="small muted">${it.sets} × ${esc(it.reps)}</div>
      <button class="vbtn" style="margin-top:6px" data-a="openVar" data-kind="tpl" data-i="${i}" aria-label="Variation: ${esc(varLbl(ex))}. Tap to switch">${esc(varLbl(ex))}${ICON.chev}</button></div>
      <button class="chip" data-a="toggleCore" data-i="${i}" aria-pressed="${it.core}" style="${it.core?"background:var(--mint);border-color:var(--mint);color:var(--ink)":""}">${it.core?"Core":"Cut if short"}</button></div>
      ${it.subs.length?`<div class="row small" style="color:var(--coral-fg);background:var(--coral-soft);border-radius:10px;padding:8px 10px">${ICON.swap}If taken, swap: ${it.subs.map(s=>esc(exFull(exById(s)))).join(" or ")}</div>`:""}
      <div class="row"><button class="chip" data-a="addSub" data-i="${i}">${ICON.swap}Add swap</button><button class="chip" data-a="rmItem" data-i="${i}" aria-label="Remove ${esc(ex.name)}">${ICON.trash}</button></div></div>`;
  });
  h+=`<button class="btn-dash" data-a="openPicker" data-target="tpl">+ Add exercise</button>`;
  h+=t.for===S.me?`<button class="btn btn-coral btn-block" data-a="start" data-id="${t.id}">Start ${sh?"short ":""}workout</button>`:`<button class="btn btn-coral btn-block" data-a="sendTpl">Send to ${esc(U(t.for).name)}</button>`;
  return h+`</div>`;
}

function syncLine(){
  const s=SY.status;
  if(s==="syncing")return "Saving…";
  if(s==="offline")return "Waiting for signal. Everything is saved on this phone.";
  if(s==="error")return "Couldn't sync: "+(SY.err||"unknown problem")+". It'll retry.";
  if(s==="synced"){const m=Math.round((Date.now()-SY.at)/60000);return "Up to date · "+(m<1?"just now":m<60?m+" min ago":ago(SY.at))}
  return "";
}
function syncSection(){

function sheetWrap(inner,label){return `<div class="overlay" data-a="closeSheet" data-self="1"><div class="sheet" role="dialog" aria-label="${esc(label)}"><div class="sheet-top"><div class="grab" aria-hidden="true"></div><button class="icon-btn sheet-x" data-a="closeSheet" aria-label="Close ${esc(label)}">${ICON.x}</button></div>${inner}</div></div>`}

      ${showBrand?`<div class="chips" style="margin-top:4px">${Object.keys(brands).length?Object.entries(brands).map(([b,c])=>`<button class="chip opt" aria-pressed="${f.brand.includes(b)}" data-a="togBrand" data-v="${esc(b)}">${esc(b)} · ${c}</button>`).join(""):`<span class="small faint">No brands logged for these results</span>`}</div>`:`<div class="small faint">Pick Machine, Cable or Smith to filter by brand.</div>`}</fieldset>
    <fieldset><legend class="eyebrow">When</legend><div class="grid3" style="grid-template-columns:repeat(4,minmax(0,1fr))">${[["30","30 days"],["90","3 mo"],["365","Year"],["all","All"]].map(([k,l])=>`<button class="optbtn" aria-pressed="${f.when===k}" data-a="setWhen" data-v="${k}">${l}</button>`).join("")}</div></fieldset>

    h=sheetWrap(`<h2 style="margin:0;font-size:22px">Sort sets</h2><div class="stack" style="gap:6px">${Object.entries(SORTS).map(([k,l])=>`<button class="loadopt" aria-pressed="${ui.sort===k}" data-a="setSort" data-v="${k}" data-close="1"><span>${l}</span><span>${{newest:"latest first",oldest:"earliest first",heaviest:"most weight on the bar",strongest:"best effort for the weight",reps:"highest rep count",volume:"weight × reps"}[k]}</span></button>`).join("")}</div>`,"Sort");

    const who=c.kind==="active"?S.active.user:tpl.for;
    h=sheetWrap(`<div><h2 style="margin:0;font-size:22px">Which ${esc(cur.name)}?</h2><div class="small muted" style="margin-top:4px">Each version keeps its own history and PRs, so a machine never gets compared to a barbell.</div></div>

    const vol=done.reduce((a,d)=>a+d.sets.filter(s=>s.type!=="W").reduce((x,s)=>x+(+s.w||0)*(+s.r||0),0),0);

/* ---------- main render ---------- */
function render(){
  const a=document.activeElement;const id=a&&a.id;let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  applyTheme();
  const root=$("#root");
  $("#tabs").hidden=!S.onboarded;
  root.innerHTML=!S.onboarded?renderOnboard():ui.exId?renderExercise():ui.tab==="workout"?renderWorkout():ui.tab==="history"?renderHistory():ui.tab==="settings"?renderSettings():renderTemplates();
  $("#tabs").innerHTML=`<nav aria-label="Main">${[["workout","Workout",ICON.dumbbell],["history","History",ICON.clock],["templates","Templates",ICON.list],["settings","Settings",ICON.gear]].map(([k,l,i])=>`<button data-a="tab" data-v="${k}" ${ui.tab===k?'aria-current="page"':""}>${i}${l}</button>`).join("")}</nav>`;
  renderRest();renderSheet();
  if(id){const el=document.getElementById(id);if(el){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}
}
function renderRest(){
  const r=ui.rest;
  $("#restbar").innerHTML=r&&S.active?`<div class="rest" role="timer" aria-label="Rest timer"><div><div><div style="font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase">Rest</div><div class="num" id="rest-time">${mmss((r.end-Date.now())/1000)}</div></div>
    <div class="row"><button data-a="restAdd" style="background:rgba(21,17,15,.14);color:var(--ink)">+30s</button><button data-a="restSkip" style="background:var(--ink);color:var(--coral)">Skip</button></div></div></div>`:"";
}
setInterval(()=>{
  if(S.active){const e=$("#elapsed");if(e)e.textContent=mmss((Date.now()-S.active.start)/1000)}
  if(ui.rest){const left=(ui.rest.end-Date.now())/1000;const t=$("#rest-time");if(t)t.textContent=mmss(left);
    if(left<=0){ui.rest=null;renderRest();toast("Rest's up. Next set.");try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}
},500);

/* ---------- actions ---------- */
function newSets(user,exId,n){
  const L=lastEntry(user,exId);const t=L&&topSet(L.e.sets);const ex=exById(exId);const sets=[];
  if(t&&ex.equip==="barbell"&&t.w>=135)sets.push({w:Math.round(t.w*0.7/5)*5,r:5,left:"",type:"W",done:false});
  for(let i=0;i<n;i++)sets.push({w:t?t.w:"",r:"",left:"",type:"N",done:false});
  return sets;
}
function tplChanged(){
  const A=S.active;if(!A||!A.templateId||A.short)return null;const t=S.templates.find(x=>x.id===A.templateId);if(!t)return null;
  const a=t.items.map(i=>i.exId).join(","),b=A.entries.map(e=>e.exId).join(",");return a===b?null:t;
}
function applyTplUpdate(){
  const t=tplChanged();if(!t)return;const old={};t.items.forEach(i=>old[i.exId]=i);
  t.items=S.active.entries.map(en=>old[en.exId]||{exId:en.exId,sets:Math.max(1,en.sets.filter(s=>s.type!=="W").length),reps:"8–10",core:true,subs:[]});
}
/* sets with weight and reps typed in but not checked off */
function pendingSets(A,onlyEntry){const out=[];(A?A.entries:[]).forEach((en,ei)=>{if(onlyEntry!=null&&ei!==onlyEntry)return;en.sets.forEach(st=>{if(!st.done&&st.w!==""&&st.w!=null&&+st.r>0)out.push(st)})});return out}
function applyVariant(exId){
  const c=ui.varCtx;
  if(c.kind==="active"){const en=S.active.entries[c.i];if(en.exId!==exId){en.exId=exId;const L=lastEntry(S.active.user,exId);const t=L&&topSet(L.e.sets);en.sets.forEach(s=>{if(!s.done)s.w=t?t.w:""})}}
  else{const t=S.templates.find(x=>x.id===ui.tplId);t.items[c.i].exId=exId}
  ui.sheet=null;toast("Switched to "+varLbl(exById(exId)));
}
function addToTarget(exId){
  if(ui.picker.target==="variant"&&ui.varCtx.kind==="active"&&S.active.entries.some((e,i)=>e.exId===exId&&i!==ui.varCtx.i)){
    ui.sheet=null;const n=S.active.entries.findIndex(e=>e.exId===exId);toast("That version is already in this workout");save();render();
    setTimeout(()=>{const s=document.getElementById("ex-"+n);s&&s.scrollIntoView({block:"start"})},30);return}
  if(ui.picker.target==="active"&&S.active.entries.some(e=>e.exId===exId)){
    ui.sheet=null;const n=S.active.entries.findIndex(e=>e.exId===exId);toast("Already in this workout. Jumped to it.");save();render();
    setTimeout(()=>{const s=document.getElementById("ex-"+n);s&&s.scrollIntoView({block:"start"})},30);return}
  if(ui.picker.target==="tpl"&&ui.picker.subFor==null){const t=S.templates.find(x=>x.id===ui.tplId);if(t.items.some(i=>i.exId===exId)){ui.sheet=null;toast("Already in this template");save();render();return}}
  if(ui.picker.target==="variant"){applyVariant(exId);ui.picker.target=ui.varCtx.prevTarget||null;save();render();return}
  if(ui.picker.target==="active"){S.active.entries.push({exId,note:"",sets:newSets(S.active.user,exId,3)});toast("Added "+exById(exId).name);
    const n=S.active.entries.length-1;setTimeout(()=>{const s=document.getElementById("ex-"+n);if(s)s.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})},30)}
  else{const t=S.templates.find(x=>x.id===ui.tplId);if(ui.picker.subFor!=null){t.items[ui.picker.subFor].subs.push(exId);ui.picker.subFor=null}else t.items.push({exId,sets:3,reps:"8–10",core:true,subs:[]})}
  ui.sheet=null;save();render();
}
const ACT={
  tab:d=>{ui.tab=d.v;ui.exId=null;ui.exReturn=null;ui.tplId=null;window.scrollTo(0,0)},
  openSettings:()=>{ui.tab="settings";ui.exId=null;ui.tplId=null;window.scrollTo(0,0)},
  togUnit:d=>{const ex=exById(d.id);const next=unitOf(ex)==="kg"?"lbs":"kg";if(next===S.units)delete ex.unit;else ex.unit=next;toast(next==="kg"?`${ex.name} (${exLabel(ex)}) now logs in kg`:`${ex.name} (${exLabel(ex)}) back to lbs`)},
  closeSheet:(d,el,ev)=>{if(d.self&&ev.target!==el)return false;ui.sheet=null},
  setShort:d=>{ui.short[d.id]=d.v==="1"},
  start:d=>{const t=S.templates.find(x=>x.id===d.id);const sh=!!ui.short[t.id];
    if(S.active&&S.active.user===S.me){toast("Finish your current workout first");return}
    ui.updTpl=false;S.active={user:S.me,name:t.name+(sh?" · Short":""),templateId:t.id,short:sh,start:Date.now(),entries:t.items.filter(i=>!sh||i.core).map(i=>({exId:i.exId,note:"",sets:newSets(S.me,i.exId,i.sets)}))};

function setSync(st,err){SY.status=st;SY.err=err||"";if(st==="synced")SY.at=Date.now();const el=$("#sync-line");if(el)el.textContent=syncLine();
  document.querySelectorAll(".sync-dot").forEach(d=>{if(SY.user)d.className="sync-dot s-"+st})}
function schedulePush(){if(!sb||!SY.user)return;clearTimeout(SY.timer);SY.timer=setTimeout(push,2000)}
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mergeArr(a,b){const ids=new Set((a||[]).map(x=>x.id));return (a||[]).concat((b||[]).filter(x=>x&&!ids.has(x.id)))}
function mergeState(local,cloud){
  const out=Object.assign({},cloud,local);
  out.sessions=mergeArr(local.sessions,cloud.sessions).sort((x,y)=>x.date-y.date);
  out.exercises=mergeArr(local.exercises,cloud.exercises);
  out.templates=mergeArr(local.templates,cloud.templates);
  out.active=local.active||cloud.active||null;
  out.lastBackup=Math.max(local.lastBackup||0,cloud.lastBackup||0);
  return out;
}
const hasData=st=>!!(st&&((st.sessions&&st.sessions.length)||(st.templates&&st.templates.length)||st.active));
async function pullMerge(){
  const {data,error}=await sb.from("user_data").select("data,updated_at").eq("user_id",SY.user.id).maybeSingle();
  if(error)throw error;
  if(!data||data.updated_at===META.syncedAt)return false;
  const cloud=data.data||{};
  if(cloud.v!==1){META.syncedAt=data.updated_at;saveMeta();return false}
  SY.applying=true;
  if(!META.dirty||!hasData(S)){S=Object.assign(cloud,{me:"d",solo:true,onboarded:true});META.dirty=false}
  else{S=mergeState(S,cloud);S.onboarded=true;META.dirty=true}
  persistLocal();SY.applying=false;
  META.syncedAt=data.updated_at;saveMeta();render();
  return true;
}

  if(!sb||!SY.user)return;

    const {data:head,error:e1}=await sb.from("user_data").select("updated_at").eq("user_id",SY.user.id).maybeSingle();
    if(e1)throw e1;
    if(head&&head.updated_at!==META.syncedAt)await pullMerge(); // another phone saved first: fold it in
    if(META.dirty||!head){
      const js=JSON.stringify(S);
      const {data,error}=await sb.from("user_data").upsert({user_id:SY.user.id,data:S},{onConflict:"user_id"}).select("updated_at").single();
      if(error)throw error;
      META.syncedAt=data.updated_at;
      if(JSON.stringify(S)===js)META.dirty=false;
      saveMeta();
    }
    setSync("synced");
  }catch(err){SY.applying=false;setSync(navigator.onLine?"error":"offline",err&&err.message)}
  SY.busy=false;
  if(SY.again){SY.again=false;schedulePush()}
}
function authMsg(e){
  const m=String(e&&e.message||"").toLowerCase();
  if(m.includes("invalid login"))return "That email and password don't match. Check for typos, or create an account.";
  if(m.includes("already registered")||m.includes("already been registered")||m.includes("already exists"))return "There's already an account with that email. Sign in instead.";
  if(m.includes("not confirmed"))return "This account is waiting on email confirmation. Turn off “Confirm email” in Supabase, then sign in again.";
  if(m.includes("signups not allowed")||m.includes("signup is disabled")||m.includes("not allowed"))return "New accounts are turned off for this app.";
  if(m.includes("fetch")||m.includes("network")||m.includes("load failed"))return "Couldn't reach the server. Try again when you have signal.";
  if(m.includes("rate")||m.includes("too many"))return "Too many tries. Wait a minute and try again.";
  if(m.includes("password"))return "Use a password with at least 6 characters.";
  return (e&&e.message)||"Something went wrong. Try again.";
}
async function doAuth(){
  const a=ui.auth;const email=(a.email||"").trim().toLowerCase();const pass=a.pass||"";
  if(!/^\S+@\S+\.\S+$/.test(email)){a.err="Enter your email address.";render();return}
  if(pass.length<6){a.err="Use a password with at least 6 characters.";render();return}
  a.busy=true;a.err="";render();
  try{
    const up=a.mode==="signup";
    const r=up?await sb.auth.signUp({email,password:pass}):await sb.auth.signInWithPassword({email,password:pass});
    if(r.error)throw r.error;
    if(up&&!r.data.session){a.mode="signin";a.err="Account created, but Supabase is still asking for email confirmation. Turn off “Confirm email” in Supabase, then sign in."}
    else{a.pass="";toast(up?"Account created. Syncing your workouts":"Signed in. Syncing your workouts")}
  }catch(err){a.err=authMsg(err)}
  a.busy=false;render();
}
async function initSync(){
  if(!sb)return;
  sb.auth.onAuthStateChange((ev,session)=>{
    const u=session&&session.user||null;const changed=(u&&u.id)!==(SY.user&&SY.user.id);SY.user=u;
    if(changed)setTimeout(()=>{if(u){META.dirty=META.dirty||hasData(S);saveMeta();push();loadPartner()}else{setSync("off");clearPartner()}render()},0);
  });
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&SY.user){push();loadPartner()}});
  window.addEventListener("online",()=>{if(SY.user)push()});
}
/* ---------- partner pairing ---------- */
function applyPartner(pk){
  const d=pk.data||{};
  P.on=true;P.id=pk.id;P.email=pk.email||"";
  P.name=(d.users&&d.users.d&&d.users.d.name)||pk.name||(P.email.split("@")[0])||"Partner";
  const mine=new Map(S.exercises.map(e=>[e.id,e]));const map={};PX=[];
  for(const e of (d.exercises||[])){const m=mine.get(e.id);
    if(m&&normName(m.name)===normName(e.name)&&m.equip===e.equip&&normBrand(m.brand)===normBrand(e.brand))map[e.id]=e.id;
    else{const c=Object.assign({},e,{id:"p:"+e.id,partner:true});PX.push(c);map[e.id]=c.id}}
  const known=new Set(S.exercises.map(e=>e.id).concat(PX.map(e=>e.id)));
  P.sessions=(d.sessions||[]).filter(x=>x.user==="d").map(x=>Object.assign({},x,{id:"p:"+x.id,user:"p",
    entries:(x.entries||[]).map(en=>Object.assign({},en,{exId:map[en.exId]||"p:"+en.exId})).filter(en=>known.has(en.exId))}))
    .sort((a,b)=>a.date-b.date);
  const u=S.users.p;u.name=P.name;u.initial=(P.name.trim()[0]||"P").toUpperCase();
}
function clearPartner(){P.on=false;P.id=null;P.rowId=null;P.sessions=[];PX=[];P.invite=null;P.incoming=null;
  if(ui.whose!==S.me)ui.whose=S.me;if(ui.f.whose!==S.me)ui.f.whose=S.me;ui.exWho=null;
  try{localStorage.removeItem(KEY+"-partner")}catch(e){}}
async function loadPartner(){
  if(!sb||!SY.user)return;
  try{
    const {data:rows,error}=await sb.from("partnerships").select("*");if(error)throw error;
    const me=SY.user.id,myEmail=String(SY.user.email||"").toLowerCase();
    const acc=rows.find(r=>r.status==="accepted");
    P.invite=rows.find(r=>r.status==="pending"&&r.inviter===me)||null;
    P.incoming=rows.find(r=>r.status==="pending"&&r.invitee_email===myEmail&&r.inviter!==me)||null;
    if(acc){
      const mineInv=acc.inviter===me;const pid=mineInv?acc.invitee:acc.inviter;
      if(P.invite&&P.invite.id!==acc.id){sb.from("partnerships").delete().eq("id",P.invite.id).then(()=>{},()=>{});P.invite=null}
      const {data:ud}=await sb.from("user_data").select("data").eq("user_id",pid).maybeSingle();
      const pk={id:pid,email:mineInv?acc.invitee_email:acc.inviter_email,name:mineInv?"":acc.inviter_name,data:ud?ud.data:{}};
      applyPartner(pk);P.rowId=acc.id;P.incoming=null;
      try{localStorage.setItem(KEY+"-partner",JSON.stringify(Object.assign({rowId:acc.id},pk)))}catch(e){}
    }else if(P.on){const inv=P.invite,inc=P.incoming;clearPartner();P.invite=inv;P.incoming=inc}
  }catch(e){}
  render();
}
async function partnerAct(kind){
  const r=ui.pair;r.err="";r.busy=true;render();
  try{
    if(kind==="invite"){
      const email=(r.email||"").trim().toLowerCase();
      if(!/^\S+@\S+\.\S+$/.test(email))throw new Error("Enter their email address.");
      if(email===String(SY.user.email||"").toLowerCase())throw new Error("That's your own email. Use theirs.");
      const {error}=await sb.from("partnerships").insert({invitee_email:email,inviter_name:U("d").name||""});
      if(error)throw new Error(/duplicate|unique/i.test(error.message)?"You already have an invite out. Cancel it first.":error.message);
      r.email="";toast("Invite sent");
    }else if(kind==="cancel"){await sb.from("partnerships").delete().eq("id",P.invite.id);toast("Invite canceled")}
    else if(kind==="decline"){await sb.from("partnerships").delete().eq("id",P.incoming.id);toast("Invite declined")}
    else if(kind==="accept"){const {error}=await sb.rpc("accept_partnership",{p_id:P.incoming.id});if(error)throw error;toast("Paired. You can now see each other's workouts")}
    else if(kind==="unpair"){await sb.from("partnerships").delete().eq("id",P.rowId);clearPartner();toast("Unpaired")}
  }catch(e){r.err=e&&e.message||"Something went wrong. Try again."}
  r.busy=false;await loadPartner();
}
try{const c=JSON.parse(localStorage.getItem(KEY+"-partner")||"null");if(c){applyPartner(c);P.rowId=c.rowId||null}}catch(e){}
document.addEventListener("submit",ev=>{if(ev.target.id==="auth-form"){ev.preventDefault();doAuth()}});

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
initSync();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/sw.js").catch(()=>{})})}
render();
})();
</script>
